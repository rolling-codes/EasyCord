name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: Wandalen/wretry.action@v3
        with:
          action: actions/labeler@v6
          with: |
            repo-token: ${{ secrets.GITHUB_TOKEN }}
            configuration-path: .github/labeler.yml
            sync-labels: true
          attempt_limit: 3
          attempt_delay: 10000
