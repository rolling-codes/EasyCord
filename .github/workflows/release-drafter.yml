name: Release Drafter

on:
  push:
    branches: [main]
    paths-ignore:
      - "pyproject.toml"
      - "easycord/__init__.py"
      - "CHANGELOG.md"
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
