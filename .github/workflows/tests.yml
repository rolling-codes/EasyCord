name: PR Quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip ruff && python -m pip install -e ".[dev]"
      - name: Lint critical Python errors (ruff)
        run: ruff check easycord tests --select E9,F63,F7,F82
      - name: Lint advisory (ruff)
        continue-on-error: true
        run: ruff check .
        if: always()
      - name: Check release metadata
        run: python scripts/check_release_metadata.py
      - name: Verify plugin test coverage thresholds
        run: python scripts/verify_plugin_tests.py
      - name: Test (pytest)
        timeout-minutes: 10
        run: pytest
