name: Stale Issues and PRs

on:
  schedule:
    - cron: "0 9 * * *"  # daily 9 AM UTC

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          stale-issue-message: "This issue has been inactive for 30 days. It will be closed in 7 days unless there is further activity."
          stale-pr-message: "This PR has been inactive for 30 days. It will be closed in 7 days unless there is further activity."
          close-issue-message: "Closed due to inactivity. Feel free to reopen if this is still relevant."
          close-pr-message: "Closed due to inactivity. Feel free to reopen if this is still relevant."
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "pinned,security,bug"
          exempt-pr-labels: "pinned,security"
