[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easycord"
version = "5.51.0"
description = "Production-grade Discord bot framework with AI orchestration, multi-provider LLMs, and permission-gated tool execution"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["discord", "discord.py", "bot", "framework", "slash commands", "middleware", "plugins"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
]
dependencies = [
    "discord.py>=2.7.1,<3",
]

authors = [
    { name = "tee", email = "tbirrell0@gmail.com" },
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "tomli>=2; python_version < '3.11'",
    "build",
    "twine",
    "deep-translator>=1.11.4",
]
translate = [
    "deep-translator>=1.11.4",
]

[project.urls]
Homepage                = "https://github.com/rolling-codes/EasyCord"
Repository              = "https://github.com/rolling-codes/EasyCord"
Issues                  = "https://github.com/rolling-codes/EasyCord/issues"
Documentation           = "https://github.com/rolling-codes/EasyCord/blob/main/docs/README.md"
Download                = "https://github.com/rolling-codes/EasyCord/releases/download/v5.51.0/easycord-5.51.0-py3-none-any.whl"
Release                 = "https://github.com/rolling-codes/EasyCord/releases/tag/v5.51.0"
Changelog               = "https://github.com/rolling-codes/EasyCord/blob/main/CHANGELOG.md"
"Getting Started"       = "https://github.com/rolling-codes/EasyCord/blob/main/docs/getting-started.md"
"Task Scheduling"       = "https://github.com/rolling-codes/EasyCord/blob/main/docs/task-scheduling.md"
"Subcommand Groups"     = "https://github.com/rolling-codes/EasyCord/blob/main/docs/subcommand-groups.md"
"Interactive UI"        = "https://github.com/rolling-codes/EasyCord/blob/main/docs/context-interactive-ui.md"
"Conversation Memory"   = "https://github.com/rolling-codes/EasyCord/blob/main/docs/conversation-memory.md"
"Built-in Plugins"      = "https://github.com/rolling-codes/EasyCord/blob/main/docs/builtin-plugins.md"
"Context Reference"     = "https://github.com/rolling-codes/EasyCord/blob/main/docs/context-reference.md"
"Event Bus"             = "https://github.com/rolling-codes/EasyCord/blob/main/docs/event-bus.md"
"Lifecycle Hooks"       = "https://github.com/rolling-codes/EasyCord/blob/main/docs/hooks.md"
"Hot-Reload"            = "https://github.com/rolling-codes/EasyCord/blob/main/docs/hot-reload-development.md"
"Testing"               = "https://github.com/rolling-codes/EasyCord/blob/main/docs/testing.md"
"Middleware"            = "https://github.com/rolling-codes/EasyCord/blob/main/docs/middleware-patterns.md"
"Error Handling"        = "https://github.com/rolling-codes/EasyCord/blob/main/docs/error-handling.md"

[project.scripts]
easycord = "easycord.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["easycord*"]
exclude = ["tests*", "*.tests*", "*.tests"]

[tool.setuptools.package-data]
easycord = ["py.typed"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "*.pyc", "*.pyo"]
